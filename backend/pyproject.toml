[tool.poetry]
name = "brazilian-financial-assistant"
version = "0.1.0"
description = "Intelligent chatbot for Brazilian financial market tax calculations"
authors = ["Andre <andreksp@gmail.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
sqlalchemy = "^2.0.0"
chromadb = "^0.4.0"
anthropic = "^0.7.0"
python-dotenv = "^1.0.0"
httpx = "^0.25.0"
alembic = "^1.12.0"
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
black = "^23.11.0"
flake8 = "^6.1.0"
isort = "^5.12.0"
hypothesis = "^6.88.0"

[tool.poetry.group.dev.dependencies]
pytest-cov = "^4.1.0"
ipython = "^8.18.0"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
