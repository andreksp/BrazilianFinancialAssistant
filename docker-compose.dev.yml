version: '3.8'

# Development stack — SQLite + hot reload (no database container needed)
# Usage: docker-compose -f docker-compose.dev.yml up --build
# Requires: ANTHROPIC_API_KEY in .env or environment

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bfa-backend-dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/data:/app/data
      - ./backend/tests:/app/tests
      - backend_db:/app
    environment:
      DATABASE_URL: sqlite:///./app.db
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      FRONTEND_URL: http://localhost:4200
      CORS_ORIGINS: '["http://localhost:4200","http://localhost:8501","http://localhost:3000"]'
      CHROMA_DB_PATH: ./chroma_data
      LOG_LEVEL: DEBUG
      DEBUG: "true"
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
    networks:
      - bfa-dev-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bfa-frontend-dev
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - bfa-dev-network
    restart: unless-stopped

volumes:
  backend_db:

networks:
  bfa-dev-network:
    driver: bridge
