<div class="trade-input-container">
  <h2>Nova Operação</h2>

  <form [formGroup]="tradeForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label>Ativo *</label>
      <input
        type="text"
        formControlName="ativo"
        placeholder="ex: PETR4, VALE3, HGLG11"
        class="form-input"
        style="text-transform: uppercase"
      />
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Tipo de Ativo *</label>
        <select formControlName="tipo_ativo" class="form-input">
          <option value="acao">Ação</option>
          <option value="bdr">BDR</option>
          <option value="fii">Fundo Imobiliário (FII)</option>
          <option value="opcao">Opção</option>
        </select>
      </div>

      <div class="form-group">
        <label>Operação *</label>
        <select formControlName="tipo_operacao" class="form-input">
          <option value="compra">🟢 Compra</option>
          <option value="venda">🔴 Venda</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Quantidade *</label>
        <input
          type="number"
          formControlName="quantidade"
          placeholder="100"
          step="1"
          min="1"
          class="form-input"
        />
      </div>

      <div class="form-group">
        <label>Preço Unitário (R$) *</label>
        <input
          type="number"
          formControlName="preco_unitario"
          placeholder="25,50"
          step="0.01"
          min="0.01"
          class="form-input"
        />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Data da Operação *</label>
        <input
          type="date"
          formControlName="data_operacao"
          class="form-input"
        />
      </div>

      <div class="form-group">
        <label>Corretora</label>
        <select formControlName="corretora" class="form-input">
          <option value="">Sem corretagem</option>
          <option *ngFor="let broker of brokers" [value]="broker">{{ broker }}</option>
        </select>
      </div>
    </div>

    <div *ngIf="error" class="error-message">{{ error }}</div>

    <div class="form-buttons">
      <button type="submit" [disabled]="loading || tradeForm.invalid" class="btn-primary">
        {{ loading ? 'Processando...' : 'Calcular' }}
      </button>
      <button type="button" (click)="resetForm()" class="btn-secondary">
        Limpar
      </button>
    </div>
  </form>

  <div *ngIf="buyConfirmation" class="buy-confirmation">
    ✅ {{ buyConfirmation }}
  </div>

  <app-results *ngIf="calculationResult" [result]="calculationResult"></app-results>
</div>
