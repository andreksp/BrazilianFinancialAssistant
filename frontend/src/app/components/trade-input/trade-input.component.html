<div class="trade-input-container">
  <h2>Nova Operação</h2>

  <form [formGroup]="tradeForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label>Ativo:</label>
      <input
        type="text"
        formControlName="ativo"
        placeholder="ex: PETR4, VALE3"
        class="form-input"
      />
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Tipo de Ativo:</label>
        <select formControlName="tipo_ativo" class="form-input">
          <option *ngFor="let type of assetTypes" [value]="type">
            {{ type.toUpperCase() }}
          </option>
        </select>
      </div>

      <div class="form-group">
        <label>Tipo de Operação:</label>
        <select formControlName="tipo_operacao" class="form-input">
          <option *ngFor="let op of operationTypes" [value]="op">
            {{ op.toUpperCase() }}
          </option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Quantidade:</label>
        <input
          type="number"
          formControlName="quantidade"
          placeholder="0"
          step="0.01"
          class="form-input"
        />
      </div>

      <div class="form-group">
        <label>Preço Unitário:</label>
        <input
          type="number"
          formControlName="preco_unitario"
          placeholder="0,00"
          step="0.01"
          class="form-input"
        />
      </div>
    </div>

    <div class="form-group">
      <label>Data:</label>
      <input
        type="date"
        formControlName="data_operacao"
        class="form-input"
      />
    </div>

    <div class="form-group">
      <label>Corretora:</label>
      <select formControlName="corretora" class="form-input">
        <option value="">Selecione...</option>
        <option *ngFor="let broker of brokers" [value]="broker">
          {{ broker }}
        </option>
      </select>
    </div>

    <div *ngIf="error" class="error-message">{{ error }}</div>

    <div class="form-buttons">
      <button type="submit" [disabled]="loading" class="btn-primary">
        {{ loading ? 'Processando...' : 'Calcular' }}
      </button>
      <button type="button" (click)="resetForm()" class="btn-secondary">
        Limpar
      </button>
    </div>
  </form>

  <app-results
    *ngIf="calculationResult"
    [result]="calculationResult"
  ></app-results>
</div>
